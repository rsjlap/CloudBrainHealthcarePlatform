# 东软智慧云脑诊疗平台 — Nginx 站点配置（Linux / 通用）
#
# 部署前请修改：
#   1. server_name
#   2. root（前端 dist 绝对路径）
#
# Linux 示例：
#   root /var/www/cloud-brain-medical/dist;
#
# 或由脚本生成（Windows）：
#   .\deploy\scripts\setup-nginx-windows.ps1

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloud_brain_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态资源（npm run build 后的 dist 目录）
    root /var/www/cloud-brain-medical/dist;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建文件名带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API（HTTP + SSE 流式 + WebSocket 统一反代）
    location /api/ {
        proxy_pass http://cloud_brain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 3600s;

        # SSE / AI 流式响应
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Knife4j / Swagger（生产环境可在后端关闭 SWAGGER_ENABLED）
    location ~ ^/(doc\.html|webjars/|swagger-ui|v3/) {
        proxy_pass http://cloud_brain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
