spring:
  profiles:
    active: dev
  application:
    name: cloud-brain-medical-backend
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-cafac6f855f9456cba549cb6e6451f52}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.3
    retry:
      max-attempts: 2
    timeout: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: ${JWT_SECRET:cloud-brain-medical-jwt-secret-key-256bits-minimum-length}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

app:
  ai:
    enabled: ${AI_ENABLED:false}
  kg:
    enabled: ${KG_ENABLED:false}
    base-url: ${KG_BASE_URL:http://127.0.0.1:5000}
    api-mode: ${KG_API_MODE:legacy}
    connect-timeout-ms: 5000
    read-timeout-ms: 20000
    paths:
      health: /health
      chat: /kg/chat
      exam: /kg/query/exam
      drug: /kg/query/drug
      forbidden: /kg/query/drug-forbidden
  speech:
    enabled: ${SPEECH_ENABLED:false}
    provider: iflytek
    max-duration-seconds: 180
    max-file-size-bytes: 10485760
    iflytek:
      app-id: ${IFLYTEK_APP_ID:}
      api-key: ${IFLYTEK_API_KEY:}
      api-secret: ${IFLYTEK_API_SECRET:}
      host: iat-api.xfyun.cn
      path: /v2/iat
